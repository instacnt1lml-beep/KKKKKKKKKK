<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amor Para Sempre</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a0033, #330033);
      color: #ff99cc;
      font-family: 'Arial', sans-serif;
      text-align: center;
      min-height: 100vh;
    }
    .container {
      padding: 40px 20px;
    }
    h1 {
      font-size: 3.5rem;
      margin: 30px 0;
      text-shadow: 0 0 20px #ff66aa;
      color: #ffccdd;
    }
    .photos {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      margin: 40px 0;
    }
    .photo {
      border: 8px solid #ff99cc;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(255, 105, 180, 0.6);
      transition: transform 0.4s;
    }
    .photo:hover {
      transform: scale(1.08);
    }
    .heart {
      font-size: 4rem;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Amor Para Sempre ❤️</h1>
    
    <div class="photos">
      <img src="foto1.jpg" class="photo" width="380" alt="Casal 1">
      <img src="foto2.jpg" class="photo" width="380" alt="Casal 2">
    </div>

    <p style="font-size: 1.8rem; margin-top: 30px;">
      Você e eu... para sempre 💕
    </p>
  </div>
</body>
</html>
